<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Zähler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F2E8; --paper:#FFFFFF; --ink:#1F1B2E; --muted:#6B6580; --line:#E3DDD0;
  --accent:#D62F6E; --accent-ink:#FFFFFF; --gold:#E8A317; --bar:#EFE9DC; --field:#F6F2E8;
  --shadow:0 2px 10px rgba(31,27,46,.08);
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#123B33; --paper:#1B4A40; --ink:#F4EFE3; --muted:#A9C2B8; --line:#2E6255;
    --accent:#FF5C97; --accent-ink:#1F1B2E; --gold:#F5C04A; --bar:#0E2E28; --field:#123B33;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#123B33; --paper:#1B4A40; --ink:#F4EFE3; --muted:#A9C2B8; --line:#2E6255;
  --accent:#FF5C97; --accent-ink:#1F1B2E; --gold:#F5C04A; --bar:#0E2E28; --field:#123B33;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:20px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:42px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;transform:rotate(-6deg);box-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:11px;font-family:var(--display);font-weight:600;font-size:16px;background:var(--bar);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.list{display:grid;gap:8px}
.p{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;background:var(--paper);border-radius:12px;box-shadow:var(--shadow)}
.p .rank{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.p.lead .rank{color:var(--gold)}
.p .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .tot{font-family:var(--display);font-weight:700;font-size:24px;min-width:48px;text-align:right}
.p input{width:74px;padding:9px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--field);text-align:center;font-family:var(--display);font-weight:600;font-size:18px}
.p input::placeholder{color:var(--muted);font-weight:400}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.banner .sub{color:inherit;opacity:.85}
.sec{margin-top:22px;display:grid;gap:10px}
.sec .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hist{overflow-x:auto;border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}
table{border-collapse:collapse;min-width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--paper);font-weight:700}
thead th{font-family:var(--display);font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:16px 8px}
/* setup */
.plist{display:grid;gap:8px}
.plist .row{display:flex;gap:8px;align-items:center}
.plist input[type="text"]{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field)}
.x{width:38px;height:38px;border-radius:10px;background:var(--bar);color:var(--muted);font-weight:700;display:grid;place-items:center}
.card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.tgt{width:80px;padding:8px;border-radius:9px;border:1.5px solid var(--line);background:var(--field);text-align:center}
.confirm{display:grid;gap:8px;padding:12px;border-radius:12px;border:1.5px dashed var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><div class="mark">7</div><div><h1>Flip 7</h1><div class="sub" id="subline"></div></div></div>
    <button class="btn small ghost" id="btnSetup" type="button">Spieler</button>
  </div>

  <section id="view-setup" hidden>
    <div class="card">
      <div><h2>Wer spielt mit?</h2><div class="sub">Namen eintragen, dann los.</div></div>
      <div class="plist" id="plist"></div>
      <div class="row">
        <button class="btn small" id="btnAdd" type="button">+ Spieler</button>
        <div class="grow"></div>
        <label class="row" style="gap:6px"><span class="sub">Ziel</span><input class="tgt num" type="number" id="target" min="10" step="10"></label>
      </div>
      <button class="btn primary block" id="btnStart" type="button">Los geht's</button>
    </div>
  </section>

  <section id="view-game">
    <div class="banner" id="winner" hidden></div>
    <div class="list" id="list"></div>

    <div class="sec">
      <div class="hd"><h2>Verlauf</h2><button class="btn small ghost" id="btnUndo" type="button">Letzte Runde zurück</button></div>
      <div class="hist" id="history"></div>
      <button class="btn ghost block" id="btnReset" type="button">Neues Spiel</button>
      <div class="confirm" id="resetConfirm" hidden>
        <div>Alle Punkte auf 0 setzen? Die Spieler bleiben.</div>
        <div class="row"><button class="btn small primary" id="btnResetYes" type="button">Ja</button><button class="btn small" id="btnResetNo" type="button">Abbrechen</button></div>
      </div>
    </div>
  </section>
</div>

<div class="foot" id="foot">
  <div class="in"><button class="btn primary" id="btnFinish" type="button">Runde eintragen</button></div>
</div>

<script>
(function(){
  const KEY='flip7-simple-v1';
  const DEFAULT_NAMES=['Anna','Ben','Clara','David','Eva','Felix','Greta','Hannes','Ida','Jonas'];
  let S=load(); let setupOpen=false;

  function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.players) return s; }catch(e){} return {players:[],rounds:[],draft:{},target:200,nextId:1}; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const total=pid=>S.rounds.reduce((a,r)=>a+(Number(r[pid])||0),0);
  function winners(){
    const rows=S.players.map(p=>({p,t:total(p.id)})).sort((a,b)=>b.t-a.t);
    if(!rows.length||rows[0].t<S.target) return null;
    return rows.filter(r=>r.t===rows[0].t);
  }

  function render(){
    $('view-setup').hidden=!setupOpen; $('view-game').hidden=setupOpen; $('foot').hidden=setupOpen;
    $('btnSetup').textContent=setupOpen?'Zurück':'Spieler';
    $('subline').textContent=`${S.players.length} Spieler · Ziel ${S.target}`;
    if(setupOpen){ renderSetup(); return; }
    renderList(); renderHistory();
  }

  function renderSetup(){
    const list=$('plist'); list.innerHTML='';
    S.players.forEach(p=>{
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<input type="text" id="pn-${p.id}" placeholder="Name" autocomplete="off"><button class="x" type="button" aria-label="Entfernen">✕</button>`;
      const inp=row.querySelector('input'); inp.value=p.name;
      inp.addEventListener('input',()=>{ p.name=inp.value; save(); });
      row.querySelector('.x').addEventListener('click',()=>{ S.players=S.players.filter(x=>x.id!==p.id); delete S.draft[p.id]; save(); render(); });
      list.appendChild(row);
    });
    $('target').value=S.target;
    $('btnStart').disabled=S.players.length<2;
    $('btnStart').textContent=S.rounds.length?'Weiter':"Los geht's";
  }

  function renderList(){
    const w=winners(); const b=$('winner');
    if(w){ b.hidden=false; b.innerHTML=`<div class="sub">Spielende nach ${S.rounds.length} Runden</div><h2>${esc(w.map(x=>x.p.name).join(' & '))} gewinnt mit ${w[0].t} Punkten</h2>`; }
    else b.hidden=true;

    const rows=S.players.map(p=>({p,t:total(p.id)})).sort((a,b)=>b.t-a.t);
    const top=rows.length?rows[0].t:0;
    const list=$('list'); list.innerHTML='';
    if(!rows.length){ list.innerHTML='<div class="empty">Noch keine Spieler. Oben auf „Spieler“ tippen.</div>'; }
    rows.forEach((r,i)=>{
      const rank=rows.findIndex(x=>x.t===r.t)+1;
      const el=document.createElement('div'); el.className='p'+(r.t===top&&top>0?' lead':'');
      el.innerHTML=`<div class="rank num">${rank}</div><div class="name">${esc(r.p.name)}</div><div class="tot num">${r.t}</div><input type="number" inputmode="numeric" id="in-${r.p.id}" placeholder="+" min="0">`;
      const inp=el.querySelector('input'); inp.value=S.draft[r.p.id]??'';
      inp.addEventListener('input',()=>{ S.draft[r.p.id]=inp.value; save(); $('btnFinish').disabled=!anyDraft(); });
      inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ const all=[...list.querySelectorAll('input')]; const k=all.indexOf(inp); if(k<all.length-1) all[k+1].focus(); else inp.blur(); } });
      list.appendChild(el);
    });
    $('btnFinish').disabled=!anyDraft();
  }
  const anyDraft=()=>S.players.some(p=>S.draft[p.id]!==undefined&&S.draft[p.id]!=='');

  function renderHistory(){
    const box=$('history'); $('btnUndo').disabled=!S.rounds.length;
    if(!S.rounds.length){ box.innerHTML='<div class="empty">Noch keine Runde eingetragen.</div>'; return; }
    let h='<table><thead><tr><th>Spieler</th>'+S.rounds.map((_,i)=>`<th class="num">${i+1}</th>`).join('')+'<th>Σ</th></tr></thead><tbody>';
    S.players.forEach(p=>{ h+=`<tr><td>${esc(p.name)}</td>`+S.rounds.map(r=>`<td class="num">${Number(r[p.id])||0}</td>`).join('')+`<td class="num"><b>${total(p.id)}</b></td></tr>`; });
    box.innerHTML=h+'</tbody></table>';
  }

  $('btnSetup').addEventListener('click',()=>{ setupOpen=!setupOpen; render(); });
  $('btnAdd').addEventListener('click',()=>{ addPlayer(); render(); const last=document.querySelector('#plist .row:last-child input'); if(last) last.focus(); });
  $('target').addEventListener('change',ev=>{ S.target=Math.max(10,Number(ev.target.value)||200); save(); });
  $('btnStart').addEventListener('click',()=>{ S.players.forEach((p,i)=>{ if(!p.name.trim()) p.name='Spieler '+(i+1); }); setupOpen=false; save(); render(); });
  $('btnFinish').addEventListener('click',()=>{
    const r={}; S.players.forEach(p=>{ r[p.id]=Number(S.draft[p.id])||0; });
    S.rounds.push(r); S.draft={}; save(); render(); window.scrollTo({top:0});
  });
  $('btnUndo').addEventListener('click',()=>{ const r=S.rounds.pop(); if(r){ S.draft={}; S.players.forEach(p=>{ S.draft[p.id]=String(r[p.id]??''); }); save(); render(); } });
  $('btnReset').addEventListener('click',()=>{ $('resetConfirm').hidden=false; });
  $('btnResetNo').addEventListener('click',()=>{ $('resetConfirm').hidden=true; });
  $('btnResetYes').addEventListener('click',()=>{ S.rounds=[]; S.draft={}; save(); $('resetConfirm').hidden=true; render(); });

  function addPlayer(){ const i=S.players.length; S.players.push({id:S.nextId++,name:DEFAULT_NAMES[i]||''}); save(); }
  if(!S.players.length){ for(let i=0;i<10;i++) addPlayer(); setupOpen=true; }
  render();
})();
</script>
</body>
</html>
